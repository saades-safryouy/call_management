# Server Configuration
server.port=8080
server.servlet.context-path=/api
spring.application.name=Call Management System API

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/call_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.pfe.callmanagement=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT Configuration
jwt.secret=MySecretKeyForJWTAuthenticationInCallManagementSystemPFEProject2026
jwt.expiration=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

#Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Application Information
app.version=1.0.0